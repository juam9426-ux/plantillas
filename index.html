<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8e8e8;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .paypal-logo {
            height: 32px;
            display: flex;
            align-items: center;
        }

        .paypal-logo img {
            height: 100%;
            object-fit: contain;
            max-width: 120px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #f5f5f5;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #222;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-title.collapsible {
            cursor: pointer;
            user-select: none;
            padding: 8px 0;
        }

        .collapse-icon {
            color: #666;
            font-size: 16px;
            transition: transform 0.3s;
        }

        .collapse-icon.collapsed {
            transform: rotate(180deg);
        }

        .payment-methods {
            margin-bottom: 20px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .payment-option:hover {
            border-color: #d0d0d0;
            background: #fafafa;
        }

        .payment-option.active {
            border-color: #222;
            background: #ffffff;
            box-shadow: 0 0 0 1px #222;
        }

        .radio {
            width: 18px;
            height: 18px;
            border: 2px solid #ccc;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            background: white;
        }

        .payment-option.active .radio {
            border-color: #222;
            background: #222;
        }

        .radio::after {
            content: '';
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            opacity: 0;
        }

        .payment-option.active .radio::after {
            opacity: 1;
        }

        .payment-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .payment-icon {
            width: 40px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #f5f5f5;
            border-radius: 4px;
            overflow: hidden;
        }

        .payment-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            width: auto;
            height: auto;
        }

        .payment-details {
            flex: 1;
        }

        .payment-name {
            font-size: 13px;
            font-weight: 500;
            color: #222;
            line-height: 1.3;
        }

        .payment-desc {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .payment-amount {
            font-size: 13px;
            font-weight: 600;
            color: #222;
            white-space: nowrap;
            margin-left: 12px;
        }

        .show-all-link {
            color: #0070ba;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
            display: block;
            transition: color 0.2s;
        }

        .show-all-link:hover {
            color: #005a9c;
            text-decoration: underline;
        }

        .add-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            color: #0070ba;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            background: transparent;
            border: 2px dashed #ddd;
        }

        .add-card:hover {
            background: #f0f5ff;
            border-color: #0070ba;
        }

        .add-icon {
            font-size: 18px;
            font-weight: bold;
        }

        .divider {
            height: 1px;
            background: #e8e8e8;
            margin: 16px 0;
        }

        .summary-section {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }

        .summary-section:hover {
            background: #efefef;
        }

        .summary-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .summary-icon {
            font-size: 18px;
        }

        .summary-amount {
            font-size: 15px;
            font-weight: 600;
            color: #222;
        }

        .dropdown-arrow {
            color: #999;
            font-size: 16px;
            transition: transform 0.3s;
        }

        .dropdown-arrow.rotated {
            transform: rotate(180deg);
        }

        .pay-button {
            width: 100%;
            padding: 14px;
            background: #003087;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .pay-button:hover {
            background: #002160;
            box-shadow: 0 2px 8px rgba(0, 48, 135, 0.3);
        }

        .pay-button:active {
            transform: scale(0.99);
        }

        .collapsed-content {
            max-height: 400px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsed-content.hidden {
            max-height: 0;
            overflow: hidden;
        }

        .summary-details {
            background: white;
            border-radius: 8px;
            padding: 16px 14px;
            margin-top: 12px;
            margin-bottom: 12px;
            display: none;
            border: 1px solid #e8e8e8;
        }

        .summary-details.show {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #666;
        }

        .detail-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid #e8e8e8;
            color: #222;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="https://www.paypal.com/pay/_next/static/media/paypal-rebrand.3fo58hxqd2-k_.svg?dpl=0-579-1_20261008085749764" alt="PayPal">
                </div>
                <div class="paypal-logo">
                    <img src="https://www.paypal.com/pay/_next/static/media/paypal-rebrand.3fo58hxqd2-k_.svg?dpl=0-579-1_20261008085749764" alt="PayPal">
                </div>
            </div>
            <button class="close-btn">✕</button>
        </div>

        <!-- Pay With Section -->
        <div class="payment-methods">
            <div class="section-title collapsible" onclick="togglePaymentMethods(this)">
                <span>Pagar con</span>
                <span class="collapse-icon">⌃</span>
            </div>

            <div class="collapsed-content" id="paymentContent">
                <!-- Mastercard -->
                <div class="payment-option" onclick="selectPayment(this, 'mastercard')">
                    <div class="radio"></div>
                    <div class="payment-info">
                        <div class="payment-icon">
                            <img src="https://pics.paypal.com/00/s/OTY5WDE1MzZYUE5H/p/NGU3OGFjMmMtYmFhNi00N2YxLWIxZWEtNWM2NDQ3NDg3OGRm/image_0.png?format=auto&width=64&quality=85" alt="Mastercard">
                        </div>
                        <div class="payment-details">
                            <div class="payment-name">Mastercard Débito Clásica</div>
                            <div class="payment-desc">Cargo ••3006</div>
                        </div>
                    </div>
                </div>

                <div class="show-all-link" onclick="showAllMethods()">Mostrar todos los métodos de pago</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- PayPal Balance Section -->
        <div class="payment-methods">
            <div style="margin-bottom: 8px;">
                <!-- PayPal Balance -->
                <div class="payment-option active" onclick="selectPayment(this, 'paypal')">
                    <div class="radio"></div>
                    <div class="payment-info">
                        <div class="payment-icon">
                            <img src="https://www.paypal.com/pay/_next/static/media/paypal-balance-icon.2b6aoe3rlv2nw.svg?dpl=0-579-1_20261008085749764" alt="PayPal Balance">
                        </div>
                        <div class="payment-details">
                            <div class="payment-name">Saldo de PayPal</div>
                            <div class="payment-desc">$1.787,29 disponibles</div>
                        </div>
                    </div>
                    <div class="payment-amount">$0,99</div>
                </div>

                <div class="add-card" onclick="addNewCard()">
                    <span class="add-icon">+</span>
                    <span>Agregar tarjeta</span>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Order Summary -->
        <div class="summary-section" onclick="toggleSummary()">
            <div class="summary-left">
                <span class="summary-icon">🛍️</span>
                <span class="summary-amount">$0,99</span>
            </div>
            <span class="dropdown-arrow">∨</span>
        </div>

        <!-- Summary Details -->
        <div class="summary-details" id="summaryDetails">
            <div class="detail-row">
                <span>Subtotal</span>
                <span>$0,99</span>
            </div>
            <div class="detail-row">
                <span>Envío</span>
                <span>$0,00</span>
            </div>
            <div class="detail-row">
                <span>Impuestos</span>
                <span>$0,00</span>
            </div>
            <div class="detail-row">
                <span>Total</span>
                <span>$0,99</span>
            </div>
        </div>

        <!-- Pay Button -->
        <button class="pay-button" onclick="processPayment()">Pagar</button>
    </div>

    <script>
        let selectedPayment = 'paypal';

        function selectPayment(element, method) {
            // Remove active class from all options
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.classList.remove('active');
            });
            // Add active class to clicked option
            element.classList.add('active');
            selectedPayment = method;
        }

        function togglePaymentMethods(element) {
            const content = document.getElementById('paymentContent');
            const icon = element.querySelector('.collapse-icon');
            
            content.classList.toggle('hidden');
            icon.classList.toggle('collapsed');
        }

        function toggleSummary() {
            const details = document.getElementById('summaryDetails');
            const arrow = document.querySelector('.dropdown-arrow');
            
            details.classList.toggle('show');
            arrow.classList.toggle('rotated');
        }

        function showAllMethods() {
            alert('Mostrar todos los métodos de pago disponibles');
        }

        function addNewCard() {
            alert('Agregar nueva tarjeta de crédito/débito');
        }

        function processPayment() {
            const method = selectedPayment === 'paypal' ? 'Saldo de PayPal' : 'Mastercard Débito';
            alert(`✓ Pagando $0,99 con: ${method}`);
        }

        // Close button
        document.querySelector('.close-btn').addEventListener('click', () => {
            if (confirm('¿Deseas cerrar esta sesión de pago?')) {
                alert('Sesión cerrada');
            }
        });
    </script>
</body>
</html>
