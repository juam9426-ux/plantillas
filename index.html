<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8e8e8;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #003087;
        }

        .logo img {
            width: 28px;
            height: 28px;
        }

        .paypal-text {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            letter-spacing: -0.5px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #000;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title.collapsible {
            cursor: pointer;
            user-select: none;
        }

        .collapse-icon {
            color: #666;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .collapse-icon.collapsed {
            transform: rotate(180deg);
        }

        .payment-methods {
            margin-bottom: 24px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .payment-option:hover {
            border-color: #ddd;
            background: #fafafa;
        }

        .payment-option.active {
            border-color: #003087;
            background: #f0f5ff;
        }

        .radio {
            width: 18px;
            height: 18px;
            border: 2px solid #ccc;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
        }

        .payment-option.active .radio {
            border-color: #003087;
            background: #003087;
        }

        .radio::after {
            content: '';
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0;
        }

        .payment-option.active .radio::after {
            opacity: 1;
        }

        .payment-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .payment-icon {
            width: 32px;
            height: 20px;
            background: #1a1a1a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            font-weight: bold;
        }

        .payment-details {
            flex: 1;
        }

        .payment-name {
            font-size: 13px;
            font-weight: 500;
            color: #000;
        }

        .payment-desc {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .payment-amount {
            font-size: 13px;
            font-weight: 600;
            color: #000;
        }

        .show-all-link {
            color: #0070ba;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
            display: inline-block;
        }

        .show-all-link:hover {
            text-decoration: underline;
        }

        .add-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            color: #0070ba;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .add-card:hover {
            background: #f0f5ff;
        }

        .add-icon {
            font-size: 18px;
        }

        .summary-section {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }

        .summary-section:hover {
            background: #efefef;
        }

        .summary-icon {
            font-size: 20px;
            margin-right: 12px;
        }

        .summary-amount {
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        .dropdown-arrow {
            color: #666;
            font-size: 16px;
        }

        .pay-button {
            width: 100%;
            padding: 14px;
            background: #003087;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .pay-button:hover {
            background: #002160;
            box-shadow: 0 2px 8px rgba(0, 48, 135, 0.3);
        }

        .pay-button:active {
            transform: scale(0.99);
        }

        .divider {
            height: 1px;
            background: #e8e8e8;
            margin: 16px 0;
        }

        .collapsed-content {
            max-height: 300px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsed-content.hidden {
            max-height: 0;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                padding: 16px;
            }

            .paypal-text {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="logo">P</div>
                <div class="paypal-text">PayPal</div>
            </div>
            <button class="close-btn">✕</button>
        </div>

        <!-- Pay With Section -->
        <div class="payment-methods">
            <div class="section-title collapsible" onclick="togglePaymentMethods(this)">
                <span>Pagar con</span>
                <span class="collapse-icon">⌃</span>
            </div>

            <div class="collapsed-content" id="paymentContent">
                <!-- Mastercard -->
                <div class="payment-option" onclick="selectPayment(this, 'mastercard')">
                    <div class="radio"></div>
                    <div class="payment-info">
                        <div class="payment-icon" style="background: linear-gradient(135deg, #ff5f00 0%, #ffb000 100%);">MC</div>
                        <div class="payment-details">
                            <div class="payment-name">Mastercard Débito Clásica</div>
                            <div class="payment-desc">Cargo ••3006</div>
                        </div>
                    </div>
                </div>

                <div class="show-all-link" onclick="showAllMethods()">Mostrar todos los métodos de pago</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- PayPal Balance Section -->
        <div class="payment-methods">
            <div style="margin-bottom: 12px;">
                <!-- PayPal Balance -->
                <div class="payment-option active" onclick="selectPayment(this, 'paypal')">
                    <div class="radio"></div>
                    <div class="payment-info">
                        <div class="payment-icon" style="background: #003087; display: flex; align-items: center; justify-content: center;">
                            <span style="color: white; font-size: 12px; font-weight: bold;">P</span>
                        </div>
                        <div class="payment-details">
                            <div class="payment-name">Saldo de PayPal</div>
                            <div class="payment-desc">$1.787,29 disponibles</div>
                        </div>
                    </div>
                    <div class="payment-amount">$0,99</div>
                </div>

                <div class="add-card" onclick="addNewCard()">
                    <span class="add-icon">+</span>
                    <span>Agregar tarjeta</span>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Order Summary -->
        <div class="summary-section" onclick="toggleSummary()">
            <div style="display: flex; align-items: center;">
                <span class="summary-icon">🛍️</span>
                <span class="summary-amount">$0,99</span>
            </div>
            <span class="dropdown-arrow">∨</span>
        </div>

        <!-- Pay Button -->
        <button class="pay-button" onclick="processPayment()">Pagar</button>
    </div>

    <script>
        let selectedPayment = 'paypal';

        function selectPayment(element, method) {
            // Remove active class from all options
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.classList.remove('active');
            });
            // Add active class to clicked option
            element.classList.add('active');
            selectedPayment = method;
        }

        function togglePaymentMethods(element) {
            const content = document.getElementById('paymentContent');
            const icon = element.querySelector('.collapse-icon');
            
            content.classList.toggle('hidden');
            icon.classList.toggle('collapsed');
        }

        function toggleSummary() {
            console.log('Resumen expandido');
        }

        function showAllMethods() {
            alert('Mostrar todos los métodos de pago disponibles');
        }

        function addNewCard() {
            alert('Agregar nueva tarjeta de crédito/débito');
        }

        function processPayment() {
            alert(`Pagando $0,99 con: ${selectedPayment.toUpperCase()}`);
            // Aquí iría la lógica de pago real
        }

        // Close button
        document.querySelector('.close-btn').addEventListener('click', () => {
            alert('Cerrando checkout de PayPal');
        });
    </script>
</body>
</html>
