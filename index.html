<!DOCTYPE html>
<html lang="es" class="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Centro de Recarga Garena</title>
    <meta name="description" content="La página oficial para recargar diamantes en Free Fire. Varios métodos de pago están disponibles para jugadores de América Latina.">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #0d0d11;
            --bg-panel: #1a1a1e;
            --bg-inputbox: #252529;
            --text-title: #ffffff;
            --text-secondary: #a8a8a8;
            --primary-red: #e41e26;
            --primary-red-hover: #c91820;
            --line: #4a4a4f;
            --line-half: rgba(74, 74, 79, 0.5);
            --divider: #0d0d11;
            --box-border: #4a4a4f;
            --box-border-focus: #6a6a6f;
            --icon: #a8a8a8;
            --short-line: #6a6a6f;
        }

        html.dark {
            color-scheme: dark;
            background-color: var(--bg-base);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-title);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        #root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 56px;
            border-bottom: 1px solid rgba(74, 74, 79, 0.5);
            background-color: var(--bg-base);
        }

        @media (min-width: 768px) {
            header {
                height: 60px;
            }
        }

        .header-container {
            margin-left: auto;
            margin-right: auto;
            display: flex;
            height: 100%;
            width: 100%;
            max-width: 80rem;
            align-items: stretch;
            justify-content: space-between;
            gap: 4px;
            padding-left: 12px;
            padding-right: 12px;
        }

        @media (min-width: 768px) {
            .header-container {
                padding-left: 16px;
                padding-right: 16px;
            }
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        @media (min-width: 768px) {
            .logo-link {
                gap: 12px;
            }
        }

        .logo-img {
            width: 34px;
        }

        @media (min-width: 768px) {
            .logo-img {
                width: 100px;
                height: auto;
            }
        }

        .logo-text {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-title);
            max-width: 96px;
        }

        @media (min-width: 768px) {
            .logo-text {
                font-size: 16px;
                max-width: none;
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (min-width: 768px) {
            .header-actions {
                gap: 18px;
            }
        }

        .location-btn {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 4px;
            border-radius: 6px;
            border: 1px solid var(--box-border);
            background-color: var(--bg-inputbox);
            color: var(--text-title);
            padding: 5px 7px;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.3s ease;
            max-width: 160px;
        }

        .location-btn:hover {
            border-color: var(--box-border-focus);
        }

        .avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .bg-fixed {
            position: relative;
            background-attachment: fixed;
            background-position: top;
            background-repeat: no-repeat;
            background-image: url('https://assets.garena.com/gop/mshop/www/live/assets/FF-8d5fce78.png');
            background-size: cover;
        }

        @media (min-width: 768px) {
            .bg-fixed {
                background-color: #f9f9f9;
            }

            html.dark .bg-fixed {
                background-color: #0d0d11;
            }
        }

        .card-container {
            display: flex;
            flex-direction: column;
            max-width: 100%;
            max-height: 100%;
        }

        @media (min-width: 768px) {
            .card-container {
                margin-left: auto;
                margin-right: auto;
                margin-top: 24px;
                margin-bottom: 52px;
                max-width: 600px;
                border-radius: 16px;
                background-color: var(--bg-base);
            }
        }

        /* Banner */
        .banner {
            position: relative;
            height: 80px;
            overflow: hidden;
            background-image: url('https://assets.garena.com/gop/mshop/www/live/assets/FF-4470ba9b.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @media (min-width: 768px) {
            .banner {
                height: 120px;
                border-radius: 16px 16px 0 0;
            }
        }

        .back-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 9999px;
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.7);
            outline: 1px solid rgba(255, 255, 255, 0.7);
            outline-offset: -1px;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background-color: rgba(96, 96, 96, 0.5);
        }

        @media (min-width: 768px) {
            .back-btn {
                top: 24px;
                left: 24px;
                padding: 8px 14px;
                font-size: 16px;
            }
        }

        /* Game Info */
        .game-info {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-left: 20px;
            margin-right: 20px;
            margin-top: -36px;
        }

        @media (min-width: 768px) {
            .game-info {
                margin-left: 20px;
                margin-right: 20px;
                margin-top: -40px;
                gap: 16px;
            }
        }

        .game-icon {
            display: block;
            width: 72px;
            height: 72px;
            border-radius: 8px;
            background-color: white;
            border: 4px solid var(--bg-base);
            object-fit: contain;
            outline: 4px solid var(--bg-base);
        }

        @media (min-width: 768px) {
            .game-icon {
                width: 80px;
                height: 80px;
                border-radius: 8px;
            }
        }

        .game-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-title);
        }

        @media (min-width: 768px) {
            .game-title {
                font-size: 24px;
            }
        }

        /* Summary */
        .summary-section {
            margin-bottom: 12px;
            padding-left: 16px;
            padding-right: 16px;
        }

        @media (min-width: 768px) {
            .summary-section {
                margin-bottom: 16px;
                padding-left: 40px;
                padding-right: 40px;
            }
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (min-width: 768px) {
            .summary-grid {
                gap: 14px;
            }
        }

        .summary-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 13px;
        }

        @media (min-width: 768px) {
            .summary-item {
                padding: 10px 0;
                font-size: 14px;
            }
        }

        .summary-label {
            color: var(--text-title);
        }

        .summary-value {
            text-align: right;
            font-weight: 500;
            color: var(--text-title);
        }

        .summary-box {
            grid-column: span 2;
            margin-bottom: 8px;
        }

        .summary-box-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-radius: 5px;
            border: 1px solid rgba(74, 74, 79, 0.5);
            background-color: var(--bg-panel);
            padding: 12px;
            font-size: 12px;
        }

        @media (min-width: 768px) {
            .summary-box-content {
                font-size: 14px;
            }
        }

        .summary-box-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .diamond-icon {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .diamond-img {
            width: 12px;
            height: 12px;
            object-fit: contain;
        }

        /* Divider */
        .divider {
            height: 8px;
            background-color: var(--divider);
        }

        /* Promo Code Section */
        .promo-section {
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 0;
            padding-bottom: 0;
            border-bottom: 8px solid var(--divider);
            border-top: 1px solid var(--line);
        }

        @media (min-width: 768px) {
            .promo-section {
                padding-left: 40px;
                padding-right: 40px;
                padding-top: 8px;
            }
        }

        .promo-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 16px;
            padding-bottom: 16px;
        }

        @media (min-width: 768px) {
            .promo-content {
                padding-top: 16px;
                padding-bottom: 16px;
            }
        }

        .promo-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-title);
        }

        @media (min-width: 768px) {
            .promo-label {
                font-size: 16px;
            }
        }

        .promo-input-group {
            display: flex;
            align-items: center;
            gap: 0;
            justify-content: space-between;
        }

        .form-input {
            flex: 1;
            background-color: var(--bg-inputbox);
            border: 1px solid var(--box-border);
            color: var(--text-title);
            padding: 10px 12px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            border-radius: 6px 0 0 6px;
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--box-border-focus);
        }

        .btn-apply {
            background-color: var(--primary-red);
            color: white;
            border: 1px solid var(--primary-red);
            padding: 9px 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 0 6px 6px 0;
            height: 44px;
        }

        .btn-apply:hover:not(:disabled) {
            background-color: var(--primary-red-hover);
            border-color: var(--primary-red-hover);
        }

        .btn-apply:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Payment Section */
        .payment-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 20px;
            padding-bottom: 32px;
        }

        @media (min-width: 768px) {
            .payment-section {
                padding-left: 40px;
                padding-right: 40px;
                padding-top: 24px;
                padding-bottom: 40px;
            }
        }

        .payment-wrapper {
            width: 100%;
        }

        /* Footer */
        footer {
            background-color: var(--bg-base);
        }

        @media (min-width: 768px) {
            footer {
                background-color: #f9f9f9;
            }

            html.dark footer {
                background-color: #0d0d11;
            }
        }

        .footer-container {
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            max-width: 80rem;
        }

        .footer-hr {
            display: none;
            border-top: 1px solid rgba(74, 74, 79, 0.5);
        }

        @media (min-width: 768px) {
            .footer-hr {
                display: block;
            }
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        @media (min-width: 768px) {
            .footer-content {
                align-items: flex-start;
                padding: 16px;
                font-size: 12px;
            }
        }

        .footer-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .footer-top {
                flex-direction: row;
                justify-content: space-between;
                gap: 0;
            }
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        @media (min-width: 768px) {
            .footer-links {
                justify-content: flex-end;
            }
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .footer-link:hover {
            opacity: 0.7;
        }

        .footer-divider {
            width: 1px;
            height: 8px;
            background-color: var(--short-line);
            margin: 0 16px;
        }

        @media (min-width: 768px) {
            .footer-divider {
                margin: 0 16px;
            }
        }
    </style>
</head>
