<!DOCTYPE html>
<html data-ppui-mode="light" dir="ltr" lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pago con PayPal</title>
    <style>
        :root {
            --sys-color-background-main: #f1f2f3;
            --sys-color-background-alt: #dbdde0;
            --sys-color-background-surface: #fefefe;
            --sys-color-background-surface-hover: #f1f2f3;
            --sys-color-background-surface-active: #dbdde0;
            --sys-color-primary-main: #0544b5;
            --sys-color-primary-main-hover: #0070e0;
            --sys-color-primary-main-active: #003087;
            --sys-color-primary-contrast: #fff;
            --sys-color-link-main: #116eca;
            --sys-color-link-main-hover: #73a5ff;
            --sys-color-structure-border-high-contrast: #9198a0;
            --sys-color-structure-border-low-contrast: #cfd3d8;
            --sys-color-structure-divider: #dbdde0;
            --sys-color-success-main: #0c6e11;
            --sys-color-system-main: #001435;
            --sys-experimental-color-background-alt: #edf0f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--sys-color-background-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .viewport {
            width: 100%;
            max-width: 570px;
            background: var(--sys-color-background-surface);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(1, 5, 6, 0.12);
        }

        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--sys-color-structure-divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            height: 24px;
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 100%;
            object-fit: contain;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--sys-color-structure-border-high-contrast);
            font-size: 20px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: var(--sys-color-background-surface-hover);
        }

        .content {
            padding: 24px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 12px 0;
            cursor: pointer;
            user-select: none;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--sys-color-system-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-toggle {
            color: var(--sys-color-structure-border-high-contrast);
            font-size: 16px;
            transition: transform 0.2s;
        }

        .section-toggle.open {
            transform: rotate(180deg);
        }

        .section-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .section-content.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .payment-method {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid var(--sys-color-structure-border-low-contrast);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--sys-color-background-surface);
        }

        .payment-method:hover {
            border-color: var(--sys-color-structure-border-high-contrast);
            background: var(--sys-color-background-surface-hover);
        }

        .payment-method.active {
            border-color: var(--sys-color-primary-main);
            background: var(--sys-color-background-surface);
        }

        .payment-method.active::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid var(--sys-color-primary-main);
            border-radius: 50%;
            background: var(--sys-color-primary-main);
        }

        .payment-method.active::after {
            content: '✓';
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        .payment-method {
            position: relative;
            padding-left: 48px;
        }

        .payment-icon {
            width: 36px;
            height: 24px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--sys-color-background-surface-hover);
            border-radius: 4px;
            border: 1px solid var(--sys-color-structure-divider);
            flex-shrink: 0;
        }

        .payment-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .payment-details {
            flex: 1;
        }

        .payment-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--sys-color-system-main);
        }

        .payment-desc {
            font-size: 12px;
            color: var(--sys-color-structure-border-high-contrast);
            margin-top: 2px;
        }

        .payment-amount {
            font-size: 14px;
            font-weight: 600;
            color: var(--sys-color-system-main);
            white-space: nowrap;
            margin-left: 16px;
        }

        .add-payment {
            color: var(--sys-color-link-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
            padding: 8px 16px;
            border: none;
            background: transparent;
        }

        .add-payment:hover {
            color: var(--sys-color-link-main-hover);
        }

        .divider {
            height: 1px;
            background: var(--sys-color-structure-divider);
            margin: 24px 0;
        }

        .order-summary-trigger {
            width: 100%;
            display: flex;
            align-items: stretch;
            background: var(--sys-color-background-alt);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .order-summary-trigger:hover {
            background: #d1d5d9;
        }

        .order-summary-trigger[data-state="open"] .summary-chevron {
            transform: rotate(180deg);
        }

        .summary-left {
            display: flex;
            align-items: stretch;
            flex: 1;
            padding: 12px 16px;
        }

        .summary-icon-box {
            width: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .summary-icon {
            width: 20px;
            height: 20px;
            color: var(--sys-color-system-main);
        }

        .summary-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .summary-amount {
            font-size: 16px;
            font-weight: 600;
            color: var(--sys-color-system-main);
        }

        .summary-label {
            font-size: 12px;
            color: var(--sys-color-success-main);
            margin-top: 2px;
        }

        .summary-chevron {
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: transform 0.2s ease;
        }

        .chevron-icon {
            width: 18px;
            height: 18px;
            color: var(--sys-color-structure-border-high-contrast);
        }

        .order-details {
            background: var(--sys-experimental-color-background-alt);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--sys-color-structure-divider);
            display: none;
        }

        .order-details.show {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--sys-color-structure-border-high-contrast);
            margin-bottom: 10px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid var(--sys-color-structure-divider);
            color: var(--sys-color-system-main);
            font-weight: 600;
        }

        .footer {
            padding: 20px 24px;
            border-top: 1px solid var(--sys-color-structure-divider);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pay-btn {
            width: 100%;
            padding: 12px 24px;
            background: var(--sys-color-primary-main);
            color: var(--sys-color-primary-contrast);
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .pay-btn:hover:not(:disabled) {
            background: var(--sys-color-primary-main-hover);
            box-shadow: 0 2px 8px rgba(7, 70, 181, 0.2);
        }

        .pay-btn:active:not(:disabled) {
            background: var(--sys-color-primary-main-active);
            transform: scale(0.99);
        }

        .pay-btn:disabled {
            background: var(--sys-color-background-alt);
            color: var(--sys-color-structure-border-high-contrast);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .show-more-link {
            color: var(--sys-color-link-main);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            display: block;
            transition: color 0.2s;
        }

        .show-more-link:hover {
            color: var(--sys-color-link-main-hover);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .viewport {
                border-radius: 0;
            }

            .content {
                padding: 16px;
            }

            .header {
                padding: 12px 16px;
            }

            .footer {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="viewport">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="100" height="24" xmlns="http://www.w3.org/2000/svg">
                    <text x="2" y="18" font-size="16" font-weight="bold" fill="#003087">PayPal</text>
                </svg>
            </div>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Pay With Section -->
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    <span class="section-title">Pagar con</span>
                    <span class="section-toggle">⌃</span>
                </div>
                <div class="section-content">
                    <div class="payment-methods">
                        <!-- Mastercard -->
                        <div class="payment-method" onclick="selectPayment(this)">
                            <div class="payment-icon">
                                <img src="https://pics.paypal.com/00/s/OTY5WDE1MzZYUE5H/p/NGU3OGFjMmMtYmFhNi00N2YxLWIxZWEtNWM2NDQ3NDg3OGRm/image_0.png?format=auto&width=64&quality=85" alt="Mastercard">
                            </div>
                            <div class="payment-details">
                                <div class="payment-name">Mastercard Débito Clásica</div>
                                <div class="payment-desc">Cargo ••3006</div>
                            </div>
                        </div>
                    </div>
                    <a class="show-more-link" onclick="showAllPayments()">Mostrar todos los métodos de pago</a>
                </div>
            </div>

            <div class="divider"></div>

            <!-- PayPal Balance Section -->
            <div class="section">
                <div class="payment-methods">
                    <!-- PayPal Balance -->
                    <div class="payment-method active" onclick="selectPayment(this)">
                        <div class="payment-icon">
                            <img src="https://www.paypal.com/pay/_next/static/media/paypal-balance-icon.2b6aoe3rlv2nw.svg?dpl=0-579-1_20261008085749764" alt="PayPal Balance">
                        </div>
                        <div class="payment-details">
                            <div class="payment-name">Saldo de PayPal</div>
                            <div class="payment-desc">$1.787,29 disponibles</div>
                        </div>
                        <div class="payment-amount">$0,99</div>
                    </div>
                </div>
                <button class="add-payment" onclick="addNewPayment()">
                    <span style="font-size: 16px;">+</span> Agregar tarjeta
                </button>
            </div>

            <div class="divider"></div>

            <!-- Order Summary -->
            <button type="button" class="order-summary-trigger" data-state="closed" onclick="toggleOrderSummary(this)">
                <div class="summary-left">
                    <div class="summary-icon-box">
                        <svg class="summary-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                    </div>
                    <div class="summary-info">
                        <div class="summary-amount">$0,99</div>
                        <div class="summary-label">Información del pedido</div>
                    </div>
                </div>
                <div class="summary-chevron">
                    <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </button>

            <!-- Order Details -->
            <div class="order-details" id="orderDetails">
                <div class="detail-row">
                    <span>Subtotal</span>
                    <span>$0,99</span>
                </div>
                <div class="detail-row">
                    <span>Envío</span>
                    <span>$0,00</span>
                </div>
                <div class="detail-row">
                    <span>Impuestos</span>
                    <span>$0,00</span>
                </div>
                <div class="detail-row">
                    <span>Total</span>
                    <span>$0,99</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <button class="pay-btn" onclick="processPayment()">Pagar</button>
        </div>
    </div>

    <script>
        function toggleSection(header) {
            const content = header.nextElementSibling;
            const toggle = header.querySelector('.section-toggle');
            
            content.classList.toggle('collapsed');
            toggle.classList.toggle('open');
        }

        function selectPayment(element) {
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('active');
            });
            element.classList.add('active');
        }

        function toggleOrderSummary(button) {
            const details = document.getElementById('orderDetails');
            const state = button.getAttribute('data-state');
            
            if (state === 'closed') {
                button.setAttribute('data-state', 'open');
                details.classList.add('show');
            } else {
                button.setAttribute('data-state', 'closed');
                details.classList.remove('show');
            }
        }

        function addNewPayment() {
            alert('Agregar nueva tarjeta de crédito/débito');
        }

        function showAllPayments() {
            alert('Mostrar todos los métodos de pago disponibles');
        }

        function processPayment() {
            const button = document.querySelector('.pay-btn');
            button.disabled = true;
            button.textContent = 'Procesando...';

            setTimeout(() => {
                alert('✓ Pago de $0,99 completado exitosamente');
                button.disabled = false;
                button.textContent = 'Pagar';
            }, 2000);
        }

        function closeModal() {
            if (confirm('¿Deseas cerrar esta sesión de pago?')) {
                alert('Sesión cerrada');
            }
        }
    </script>
</body>
</html>
