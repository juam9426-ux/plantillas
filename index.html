<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Checkout</title>
    <style>
        :root {
            --sys-color-background-main: #f1f2f3;
            --sys-color-background-alt: #dbdde0;
            --sys-color-background-surface: #fefefe;
            --sys-color-background-surface-hover: #f1f2f3;
            --sys-color-background-surface-active: #dbdde0;
            --sys-color-primary-main: #0544b5;
            --sys-color-primary-main-hover: #0070e0;
            --sys-color-primary-main-active: #003087;
            --sys-color-primary-contrast: #fff;
            --sys-color-secondary-main: #0070e0;
            --sys-color-secondary-main-hover: #73a5ff;
            --sys-color-secondary-main-active: #003087;
            --sys-color-secondary-contrast: #fff;
            --sys-color-featured-main: #ffd140;
            --sys-color-featured-main-hover: #ffdf7b;
            --sys-color-featured-main-active: #f1b700;
            --sys-color-featured-contrast: #003087;
            --sys-color-link-main: #116eca;
            --sys-color-link-main-hover: #73a5ff;
            --sys-color-link-main-active: #003087;
            --sys-color-selected-main: #0070e0;
            --sys-color-selected-main-hover: #73a5ff;
            --sys-color-selected-main-active: #003087;
            --sys-color-selected-contrast: #fff;
            --sys-color-success-main: #0c6e11;
            --sys-color-success-contrast: #fff;
            --sys-color-system-main: #001435;
            --sys-color-structure-border-high-contrast: #9198a0;
            --sys-color-structure-border-low-contrast: #cfd3d8;
            --sys-color-structure-divider: #dbdde0;
            --sys-color-structure-focus: #097ff5;
            --sys-color-structure-shadow: #010101;
            --sys-experimental-color-background-surface: #fefefe;
            --sys-experimental-color-background-alt: #edf0f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--sys-color-background-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--sys-color-background-surface);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(1, 5, 6, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--sys-color-structure-divider);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--sys-color-background-surface-hover);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--sys-color-structure-divider);
        }

        .logo-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .paypal-logo {
            height: 32px;
            display: flex;
            align-items: center;
        }

        .paypal-logo img {
            height: 100%;
            object-fit: contain;
            max-width: 120px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--sys-color-structure-border-high-contrast);
            padding: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: var(--sys-color-background-surface-hover);
        }

        .close-btn:active {
            background: var(--sys-color-background-surface-active);
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--sys-color-system-main);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-title.collapsible {
            cursor: pointer;
            user-select: none;
            padding: 8px 0;
        }

        .collapse-icon {
            color: var(--sys-color-structure-border-high-contrast);
            font-size: 16px;
            transition: transform 0.3s;
        }

        .collapse-icon.collapsed {
            transform: rotate(180deg);
        }

        .payment-methods {
            margin-bottom: 20px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 2px solid var(--sys-color-structure-border-low-contrast);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--sys-color-background-surface);
        }

        .payment-option:hover {
            border-color: var(--sys-color-structure-border-high-contrast);
            background: var(--sys-color-background-surface-hover);
        }

        .payment-option.active {
            border-color: var(--sys-color-primary-main);
            background: var(--sys-color-background-surface);
            box-shadow: 0 0 0 1px var(--sys-color-primary-main);
        }

        .radio {
            width: 18px;
            height: 18px;
            border: 2px solid var(--sys-color-structure-border-low-contrast);
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            background: var(--sys-color-background-surface);
            transition: all 0.2s;
        }

        .payment-option:hover .radio {
            border-color: var(--sys-color-structure-border-high-contrast);
        }

        .payment-option.active .radio {
            border-color: var(--sys-color-primary-main);
            background: var(--sys-color-primary-main);
        }

        .radio::after {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--sys-color-primary-contrast);
            border-radius: 50%;
            opacity: 0;
        }

        .payment-option.active .radio::after {
            opacity: 1;
        }

        .payment-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .payment-icon {
            width: 40px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--sys-color-background-surface-hover);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--sys-color-structure-divider);
        }

        .payment-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            width: auto;
            height: auto;
        }

        .payment-details {
            flex: 1;
        }

        .payment-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--sys-color-system-main);
            line-height: 1.3;
        }

        .payment-desc {
            font-size: 12px;
            color: var(--sys-color-structure-border-high-contrast);
            margin-top: 3px;
        }

        .payment-amount {
            font-size: 13px;
            font-weight: 600;
            color: var(--sys-color-system-main);
            white-space: nowrap;
            margin-left: 12px;
        }

        .show-all-link {
            color: var(--sys-color-link-main);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
            display: block;
            transition: color 0.2s;
        }

        .show-all-link:hover {
            color: var(--sys-color-link-main-hover);
            text-decoration: underline;
        }

        .show-all-link:active {
            color: var(--sys-color-link-main-active);
        }

        .add-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            color: var(--sys-color-link-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            background: transparent;
            border: 2px dashed var(--sys-color-structure-divider);
        }

        .add-card:hover {
            background: var(--sys-color-background-surface-hover);
            border-color: var(--sys-color-link-main);
            color: var(--sys-color-link-main-hover);
        }

        .add-card:active {
            background: var(--sys-color-background-surface-active);
            color: var(--sys-color-link-main-active);
        }

        .add-icon {
            font-size: 18px;
            font-weight: bold;
        }

        .divider {
            height: 1px;
            background: var(--sys-color-structure-divider);
            margin: 16px 0;
        }

        .summary-section {
            background: var(--sys-color-background-alt);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }

        .summary-section:hover {
            background: #d1d5d9;
        }

        .summary-section:active {
            background: var(--sys-color-background-surface-active);
        }

        .summary-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .summary-icon {
            font-size: 18px;
        }

        .summary-amount {
            font-size: 15px;
            font-weight: 600;
            color: var(--sys-color-system-main);
        }

        .dropdown-arrow {
            color: var(--sys-color-structure-border-high-contrast);
            font-size: 16px;
            transition: transform 0.3s;
        }

        .dropdown-arrow.rotated {
            transform: rotate(180deg);
        }

        .pay-button {
            width: 100%;
            padding: 14px;
            background: var(--sys-color-primary-main);
            color: var(--sys-color-primary-contrast);
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .pay-button:hover {
            background: var(--sys-color-primary-main-hover);
            box-shadow: 0 2px 8px rgba(7, 70, 181, 0.2);
        }

        .pay-button:active {
            background: var(--sys-color-primary-main-active);
            transform: scale(0.99);
        }

        .pay-button:disabled {
            background: var(--sys-color-background-alt);
            color: var(--sys-color-structure-border-high-contrast);
            cursor: not-allowed;
        }

        .collapsed-content {
            max-height: 400px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsed-content.hidden {
            max-height: 0;
            overflow: hidden;
        }

        .summary-details {
            background: var(--sys-color-experimental-color-background-alt);
            border-radius: 8px;
            padding: 16px 14px;
            margin-top: 12px;
            margin-bottom: 12px;
            display: none;
            border: 1px solid var(--sys-color-structure-divider);
        }

        .summary-details.show {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--sys-color-structure-border-high-contrast);
        }

        .detail-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid var(--sys-color-structure-divider);
            color: var(--sys-color-system-main);
            font-weight: 600;
        }

        .success-message {
            background: #e6faee;
            color: #005243;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
            border-left: 4px solid var(--sys-color-success-main);
            font-size: 13px;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                padding: 16px;
            }

            .paypal-logo img {
                max-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="https://www.paypal.com/pay/_next/static/media/paypal-rebrand.3fo58hxqd2-k_.svg?dpl=0-579-1_20261008085749764" alt="PayPal">
                </div>
                <div class="paypal-logo">
                    <img src="https://www.paypal.com/pay/_next/static/media/paypal-rebrand.3fo58hxqd2-k_.svg?dpl=0-579-1_20261008085749764" alt="PayPal">
                </div>
            </div>
            <button class="close-btn" onclick="closeCheckout()">✕</button>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            ✓ Pago completado exitosamente
        </div>

        <!-- Pay With Section -->
        <div class="payment-methods">
            <div class="section-title collapsible" onclick="togglePaymentMethods(this)">
                <span>Pagar con</span>
                <span class="collapse-icon">⌃</span>
            </div>

            <div class="collapsed-content" id="paymentContent">
                <!-- Mastercard -->
                <div class="payment-option" onclick="selectPayment(this, 'mastercard')">
                    <div class="radio"></div>
                    <div class="payment-info">
                        <div class="payment-icon">
                            <img src="https://pics.paypal.com/00/s/OTY5WDE1MzZYUE5H/p/NGU3OGFjMmMtYmFhNi00N2YxLWIxZWEtNWM2NDQ3NDg3OGRm/image_0.png?format=auto&width=64&quality=85" alt="Mastercard">
                        </div>
                        <div class="payment-details">
                            <div class="payment-name">Mastercard Débito Clásica</div>
                            <div class="payment-desc">Cargo ••3006</div>
                        </div>
                    </div>
                </div>

                <div class="show-all-link" onclick="showAllMethods()">Mostrar todos los métodos de pago</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- PayPal Balance Section -->
        <div class="payment-methods">
            <div style="margin-bottom: 8px;">
                <!-- PayPal Balance -->
                <div class="payment-option active" onclick="selectPayment(this, 'paypal')">
                    <div class="radio"></div>
                    <div class="payment-info">
                        <div class="payment-icon">
                            <img src="https://www.paypal.com/pay/_next/static/media/paypal-balance-icon.2b6aoe3rlv2nw.svg?dpl=0-579-1_20261008085749764" alt="PayPal Balance">
                        </div>
                        <div class="payment-details">
                            <div class="payment-name">Saldo de PayPal</div>
                            <div class="payment-desc">$1.787,29 disponibles</div>
                        </div>
                    </div>
                    <div class="payment-amount">$0,99</div>
                </div>

                <div class="add-card" onclick="addNewCard()">
                    <span class="add-icon">+</span>
                    <span>Agregar tarjeta</span>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Order Summary -->
        <div class="summary-section" onclick="toggleSummary()">
            <div class="summary-left">
                <span class="summary-icon">🛍️</span>
                <span class="summary-amount">$0,99</span>
            </div>
            <span class="dropdown-arrow">∨</span>
        </div>

        <!-- Summary Details -->
        <div class="summary-details" id="summaryDetails">
            <div class="detail-row">
                <span>Subtotal</span>
                <span>$0,99</span>
            </div>
            <div class="detail-row">
                <span>Envío</span>
                <span>$0,00</span>
            </div>
            <div class="detail-row">
                <span>Impuestos</span>
                <span>$0,00</span>
            </div>
            <div class="detail-row">
                <span>Total</span>
                <span>$0,99</span>
            </div>
        </div>

        <!-- Pay Button -->
        <button class="pay-button" onclick="processPayment()">Pagar</button>
    </div>

    <script>
        let selectedPayment = 'paypal';
        let isProcessing = false;

        function selectPayment(element, method) {
            // Remove active class from all options
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.classList.remove('active');
            });
            // Add active class to clicked option
            element.classList.add('active');
            selectedPayment = method;
            
            // Hide success message when changing payment method
            hideSuccessMessage();
        }

        function togglePaymentMethods(element) {
            const content = document.getElementById('paymentContent');
            const icon = element.querySelector('.collapse-icon');
            
            content.classList.toggle('hidden');
            icon.classList.toggle('collapsed');
        }

        function toggleSummary() {
            const details = document.getElementById('summaryDetails');
            const arrow = document.querySelector('.dropdown-arrow');
            
            details.classList.toggle('show');
            arrow.classList.toggle('rotated');
        }

        function showAllMethods() {
            alert('Mostrar todos los métodos de pago disponibles');
        }

        function addNewCard() {
            alert('Agregar nueva tarjeta de crédito/débito');
        }

        function processPayment() {
            if (isProcessing) return;
            
            isProcessing = true;
            const button = document.querySelector('.pay-button');
            button.disabled = true;
            button.textContent = 'Procesando...';

            // Simular procesamiento
            setTimeout(() => {
                const method = selectedPayment === 'paypal' ? 'Saldo de PayPal' : 'Mastercard Débito';
                showSuccessMessage();
                
                button.disabled = false;
                button.textContent = 'Pagar';
                isProcessing = false;

                // Log del pago
                console.log(`✓ Pago de $0,99 realizado con: ${method}`);
            }, 2000);
        }

        function showSuccessMessage() {
            const message = document.getElementById('successMessage');
            message.classList.add('show');
            
            setTimeout(() => {
                hideSuccessMessage();
            }, 3000);
        }

        function hideSuccessMessage() {
            const message = document.getElementById('successMessage');
            message.classList.remove('show');
        }

        function closeCheckout() {
            if (confirm('¿Deseas cerrar esta sesión de pago?')) {
                alert('Sesión cerrada');
            }
        }

        // Detectar cambios de tema del sistema
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.style.colorScheme = 'dark';
        }
    </script>
</body>
</html>
